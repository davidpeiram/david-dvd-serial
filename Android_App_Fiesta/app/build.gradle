plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fiesta.cockpit'
    compileSdk 34

    defaultConfig {
        applicationId "com.fiesta.cockpit"
        minSdk 24
        targetSdk 34
        versionCode 26
        versionName "2.3.3"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
