name: Build Fiesta Cockpit Android APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK (usb-serial-for-android)
        working-directory: Android_App_Fiesta
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to apk/ folder in repo
        run: |
          mkdir -p apk
          cp Android_App_Fiesta/app/build/outputs/apk/debug/app-debug.apk apk/Fiesta_Cockpit_USB.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add apk/Fiesta_Cockpit_USB.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore(apk): publish compiled Fiesta_Cockpit_USB.apk [skip ci]"
            git push origin main
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fiesta_Cockpit_USB
          path: apk/Fiesta_Cockpit_USB.apk
